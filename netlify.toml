[functions]
  directory = "netlify/functions"

# Meta webhook — must be before the catch-all SPA redirect
[[redirects]]
  from = "/webhook/meta"
  to   = "/.netlify/functions/meta-webhook"
  status = 200
  force  = true

# Telegram owner alerts (S3) — also before the catch-all
[[redirects]]
  from = "/webhook/telegram"
  to   = "/.netlify/functions/telegram-webhook"
  status = 200
  force  = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
